[package]
name = "satelite-web"
version = "1.0.0"
description = "Satelite Proxy — pure Web backend (axum), no Tauri"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"
urlencoding = "2"
idna = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = true, features = ["json"] }
ureq = { version = "2.12", default-features = true, features = ["json"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
zip = "2"
chrono = "0.4"

[build-dependencies]
# none — no tauri-build

[profile.release]
opt-level = 2
